<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1a14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="KUBB" />
    <title>KUBB: Kings</title>

    <!--
      Balises SEO / partage social. Les URL de og:image et og:url doivent
      etre absolues (obligatoire pour Open Graph) : contrairement a
      manifest/favicon plus haut, Vite ne les reecrit pas au build, d'ou
      l'URL complete de production codee en dur plutot qu'un chemin
      relatif au base path.
    -->
    <meta
      name="description"
      content="KUBB: Kings — le duel de lancer suedois. Solo contre l'IA, 1v1/2v2 pass-and-play, mode Defi et tournoi local, directement dans le navigateur."
    />
    <link rel="canonical" href="https://thoomaslef.github.io/kubb-kings/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="KUBB: Kings" />
    <meta
      property="og:description"
      content="Le duel de lancer suedois, sur un seul telephone : solo contre l'IA, 1v1/2v2 pass-and-play, mode Defi et tournoi local."
    />
    <meta property="og:url" content="https://thoomaslef.github.io/kubb-kings/" />
    <meta property="og:image" content="https://thoomaslef.github.io/kubb-kings/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="fr_FR" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KUBB: Kings" />
    <meta name="twitter:description" content="Le duel de lancer suedois, sur un seul telephone." />
    <meta name="twitter:image" content="https://thoomaslef.github.io/kubb-kings/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
