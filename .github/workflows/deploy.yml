# Deploie le jeu sur GitHub Pages a chaque push sur main.
#
# Prerequis, a faire une seule fois dans le depot :
# Settings -> Pages -> Build and deployment -> Source : "GitHub Actions".
name: Deploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois ; les pushes rapproches annulent le precedent.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Verifie les types puis produit dist/ (voir le script "build").
      #
      # Les coordonnees Supabase sont lues A LA COMPILATION (Vite les inscrit
      # dans le bundle). Sans ces secrets, le build reussit quand meme : le
      # mode en ligne retombe simplement sur le transport local, deux onglets
      # du meme navigateur. Cf. .env.example.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
