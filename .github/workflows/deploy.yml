# Deploie le jeu sur GitHub Pages a chaque push sur main.
#
# Prerequis, a faire une seule fois dans le depot :
# Settings -> Pages -> Build and deployment -> Source : "GitHub Actions".
name: Deploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois ; les pushes rapproches annulent le precedent.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 : exige par Vitest 5 (^22.12) et confortable pour Vite 8
      # (^20.19 || >=22.12). Rester sur "20" marcherait tant que l'image en
      # fournit une 20.19+, ce qui ne se decide pas ici.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le filet de securite AVANT le build : les modules purs (regles, bareme
      # d'XP, protocole reseau, coherence du contenu) sont verifies ici, la ou
      # le compilateur ne voit rien. Un echec arrete le deploiement.
      - run: npm test

      # Verifie les types puis produit dist/ (voir le script "build").
      #
      # Les coordonnees Supabase sont lues A LA COMPILATION (Vite les inscrit
      # dans le bundle). Sans elles, le build reussit quand meme : le mode en
      # ligne retombe simplement sur le transport local, deux onglets du meme
      # navigateur. Cf. .env.example.
      #
      # Variables d'abord, secrets en repli. Ces deux valeurs ne sont PAS
      # sensibles (elles finissent dans le bundle livre, cf. .env.example), et
      # une variable a l'avantage de rester relisible : une faute de frappe
      # dans un secret, en ecriture seule, ne se voit jamais. Le repli evite
      # simplement d'avoir a se souvenir de l'onglet ou on les a mises.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      # Dit tout de suite si les coordonnees sont passees : sans ce controle,
      # un deploiement mal configure se decouvre en jouant, pas au build.
      - name: Mode en ligne configure ?
        run: |
          if grep -rq "supabase.co" dist/assets/*.js; then
            echo "OK : le bundle vise un projet Supabase (parties entre appareils)."
          else
            echo "::warning::Aucune coordonnee Supabase dans le bundle : le mode en ligne restera limite a deux onglets du meme navigateur. Renseignez VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions -> Variables)."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
